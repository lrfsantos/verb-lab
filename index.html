<style>
:root{--bg:#FFFEFB;--paper:#FFFFFF;--ink:#121417;--muted:#5B616B;--line:#EDE9E3;--green-bg:#ECFDF5;--green-line:#A7F3D0;--green-ink:#065F46;--yellow-bg:#FFFBEB;--yellow-line:#FDE68A;--radius:24px;--shadow:0 12px 32px rgba(18,20,23,.08);}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;overscroll-behavior:none}
header{max-width:720px;margin:0 auto;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;background:rgba(255,254,251,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid transparent}

.brand{display:flex;gap:10px;align-items:center;font-weight:900;font-size:20px;letter-spacing:-0.04em}.mark{width:32px;height:32px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px}

.pill.level{background:#FDF8F3}
.icon-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;font-weight:900}
main{max-width:720px;margin:0 auto;padding:10px 16px 120px}
.top-meta{display:flex;gap:10px;align-items:center;margin-top:12px}
.level-bar{flex:1;height:8px;background:#F5F2ED;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.level-bar i{display:block;height:100%;background:linear-gradient(90deg,#121417,#3a3f47);width:0%;transition:width .6s}
.level-text{font-size:12px;font-weight:800;color:var(--muted)}

.progress-wrap{margin-top:16px;display:flex;align-items:center;gap:12px}.progress{flex:1;height:8px;background:#F5F2ED;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.progress i{display:block;height:100%;background:var(--ink);width:0%;transition:width .5s}.progress-label{font-size:12px;font-weight:800;color:var(--muted);min-width:32px;text-align:right}

.card-top{display:flex;justify-content:space-between;align-items:center}

.big-wrap{display:flex;align-items:center;gap:10px;margin-top:10px}.big{font-size:28px;font-weight:900;letter-spacing:-0.04em;line-height:.9}
.speaker{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:#FDF8F3;display:grid;place-items:center;cursor:pointer;transition:all .15s;font-size:15px}.speaker:hover{border-color:var(--ink)}.speaker.playing{background:var(--ink);color:#fff;border-color:var(--ink);animation:pulse .8s infinite}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.pt{font-weight:700;color:var(--muted);margin-top:4px;font-size:14px}
.ex{margin-top:12px;background:#FDF8F3;border:1px solid var(--line);border-radius:14px;padding:12px}.ex .en{font-weight:700;font-size:15px}.ex .pt-br{color:var(--muted);font-size:14px;margin-top:4px;font-weight:600}
.details{margin-top:12px}.details summary{list-style:none;cursor:pointer;font-weight:800;font-size:13px;padding:11px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);display:flex;justify-content:space-between}.details summary::-webkit-details-marker{display:none}.details[open] summary{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.box{border:1px solid var(--line);border-radius:12px;padding:10px;background:#FCFBF8}.box b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px;font-weight:800}.box span{font-weight:900;font-size:13px}.box.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.box.wide{grid-column:span 2}.box.dark b{color:rgba(255,255,255,.55)}
.extra{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:none}.details[open] .extra{display:block}
.extra b{font-size:12px;font-weight:800;color:var(--muted)}.extra-item{font-size:13px;font-weight:600;margin-top:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cta-wrap{position:fixed;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(to top,var(--bg) 70%,rgba(255,254,251,0));padding:14px 16px 18px;display:flex;justify-content:center}
.cta-inner{max-width:720px;width:100%}
.btn-primary{height:54px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:900;font-size:15px;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(18,20,23,.15)}.btn-primary:disabled{background:#E8E2D9;color:var(--muted);box-shadow:none}.btn-primary:active{transform:scale(.98)}
.btn-sub{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;font-weight:600;min-height:16px}
#quiz{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}#quiz.open{display:flex}
.quiz-head{max-width:720px;margin:0 auto;width:100%;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:rgba(255,254,251,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.q-progress{flex:1;height:8px;background:#F5F2ED;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.q-progress i{display:block;height:100%;background:var(--ink);width:0%;transition:width .4s}
.q-count{font-weight:900;font-size:12px;color:var(--muted);min-width:44px;text-align:right}
.quiz-body{max-width:720px;margin:0 auto;width:100%;padding:18px 16px;overflow:auto;flex:1}
.q-prompt{font-size:26px;font-weight:900;letter-spacing:-0.04em;margin-top:8px;line-height:1.05;display:flex;align-items:center;gap:10px}
.typed-wrap{margin-top:18px}.typed-input{width:100%;height:58px;border:1.5px solid var(--line);border-radius:16px;background:var(--paper);padding:0 16px;font-size:20px;font-weight:800;outline:none;box-sizing:border-box}.typed-input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(18,20,23,.08)}
.q-opts{margin-top:18px;display:grid;gap:10px}.q-opt{width:100%;text-align:left;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);font-weight:800;font-size:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all .15s}.q-opt:active{transform:scale(.98)}.q-opt.correct{background:var(--green-bg);border-color:var(--green-line);color:var(--green-ink)}.q-opt.wrong{background:var(--ink);color:#fff;border-color:var(--ink)}
.feedback{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px}
.xp-badge{display:inline-flex;gap:6px;align-items:center;background:var(--green-bg);border:1px solid var(--green-line);color:var(--green-ink);font-weight:900;font-size:12px;border-radius:999px;padding:6px 10px}
#explore{position:fixed;inset:0;z-index:40;display:none}#explore.open{display:block}
.explore-backdrop{position:absolute;inset:0;background:rgba(18,20,23,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.explore-sheet{position:absolute;left:0;right:0;bottom:0;max-height:84vh;background:var(--paper);border-radius:24px 24px 0 0;border:1px solid var(--line);box-shadow:0 -12px 40px rgba(18,20,23,.15);display:flex;flex-direction:column;overflow:hidden;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.explore-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.explore-search{padding:12px 16px;border-bottom:1px solid var(--line)}.explore-search input{width:100%;height:42px;border-radius:999px;border:1.5px solid var(--line);background:#FDF8F3;padding:0 14px;font-weight:700;font-size:14px;outline:none}.explore-search input:focus{border-color:var(--ink);background:var(--paper)}
.chips{padding:10px 16px;display:flex;gap:8px;overflow:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}.chip{white-space:nowrap;font-size:12px;font-weight:800;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.explore-list{overflow:auto;padding:8px 12px 16px;display:grid;gap:8px}
.explore-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#FFFEFB;cursor:pointer}.explore-item:hover{border-color:var(--ink)}.explore-item b{font-weight:900;font-size:14px}.explore-item small{color:var(--muted);font-weight:600;font-size:12px}
.done-screen{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;place-items:center;padding:16px} .done-screen.show{display:grid}
.done-card{max-width:400px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.confetti{position:absolute;inset:0;pointer-events:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;background:#F5F2ED;border-radius:16px;padding:4px}
.tab{border:0;background:transparent;border-radius:12px;padding:10px 4px;font-weight:900;font-size:15px;cursor:pointer;color:var(--muted);line-height:1.1;font-family:inherit}.tab small{display:block;font-size:12px;font-weight:700;margin-top:3px}.tab.active{background:var(--ink);color:#fff}
.tip{margin-top:12px;background:var(--yellow-bg);border:1px solid var(--yellow-line);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.5}
.badge{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.badge.irr{background:var(--ink);color:#fff;border-color:var(--ink)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-weight:900;font-size:22px;letter-spacing:-.03em}.chain .arr{color:var(--muted);font-size:16px}.chain .hl{background:var(--green-bg);border:1px solid var(--green-line);color:var(--green-ink);border-radius:10px;padding:2px 8px}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pick{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-top:10px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-family:inherit;font-size:16px;cursor:pointer;color:var(--ink)}
.pick.on{border-color:var(--ink);background:#F7F5F0}.pk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;margin-top:2px}.pick.on .pk{background:var(--ink);color:#fff;border-color:var(--ink)}
.link-btn{background:none;border:0;padding:12px 0 0;color:var(--ink);font-weight:800;font-size:14px;text-decoration:underline;cursor:pointer;font-family:inherit}
.typed-wrap{margin-top:18px}.typed-input{width:100%;height:58px;border:2px solid var(--line);border-radius:16px;background:var(--paper);padding:0 16px;font:900 22px/1 inherit;color:var(--ink);letter-spacing:-.02em}.typed-input:focus{border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.12)}.typed-input::placeholder{font-size:15px;font-weight:700;color:var(--muted)}.pron-tip{margin-top:6px;font-size:12px;font-weight:800;color:var(--muted)}.pron-tip b{color:var(--ink)}
.pron{display:block;margin-top:4px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.01em}.box .pron{font-size:12px;margin-top:3px}.big-wrap+.pt+.ex .en{line-height:1.45}
.explore-item{appearance:none;width:100%;font:inherit;color:var(--ink);text-align:left}.explore-item:focus-visible{border-color:#2563EB}
@media (prefers-contrast:more){:root{--line:#B8B2A8;--muted:#3F4650}.card,.q-opt,.pick,.explore-item{border-width:2px}}
</style>

<script>

function simpleHash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))%1000000007;}return h;}
function simpleShuffle(arr,seed){var a=arr.slice();var t=(seed>>>0)+0x6D2B79F5;function r(){t+=0x6D2B79F5;var x=t;x=Math.imul(x^(x>>>15),x|1);x^=x+Math.imul(x^(x>>>7),x|61);return((x^(x>>>14))>>>0)/4294967296;}for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;}

/* ---------- speech ---------- */
var speechVoice=null;
function initVoices(){
  try{
    var voices=window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    if(voices.length){
      speechVoice = voices.find(function(v){return v.lang && v.lang.toLowerCase().replace('_','-')==='en-us';}) || voices.find(function(v){return v.lang && v.lang.toLowerCase().startsWith('en');}) || null;
    }
  }catch(e){}
}
if('speechSynthesis' in window){ initVoices(); window.speechSynthesis.onvoiceschanged=initVoices; }
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)) return;
    if(window.speechSynthesis.paused) window.speechSynthesis.resume();
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9; u.volume=1;
    if(speechVoice) u.voice=speechVoice;
    if(btn){
      btn.classList.add('playing');
      u.onend=function(){btn.classList.remove('playing');};
      u.onerror=function(){btn.classList.remove('playing');};
    }
    window.speechSynthesis.speak(u);
  }catch(e){ if(btn) btn.classList.remove('playing'); }
}
document.addEventListener('click',function(e){
  var b=e.target.closest ? e.target.closest('[data-say]') : null;
  if(b){ speak(b.getAttribute('data-say'), b); }
});

function pronFor(word,ctx){
  if(word==='read'){
    if(ctx && (ctx.indexOf('passado')>-1 || ctx.indexOf('part')>-1)) return 'RÉD';
    if(typeof activeTab!=='undefined' && (activeTab==='past' || activeTab==='part')){
      if(!ctx) return 'RÉD';
    }
  }
  return PRON[word] || PRON[word.toLowerCase()] || '';
}
function pronLine(word,ctx){ var p=pronFor(word,ctx); return p ? '<span class="pron">'+esc(p)+'</span>' : ''; }
function noExtraIHint(word){ var p=pronFor(word); if(!p) return ''; var last=p.slice(-1).toLowerCase(); if(/[aeiouáéíóúâêôãõ]/.test(last)) return ''; return '<div class="pron-tip">🇧🇷 <b>Não acrescente um “i” no final.</b> '+esc(word)+' → '+esc(p)+', não “'+esc(p)+'i”.</div>'; }
function pronCue(word){ return pronLine(word)+noExtraIHint(word); }
function pronPair(full){
  if(full==='was / were') return '<span class="pron">UÂZ / UÂR</span>';
  if(full==='read') return '<span class="pron">RÉD</span>';

}

function sessionGet(key,fallback){
  try{ var v=sessionStorage.getItem(key); return v===null?fallback:v; }catch(e){ return fallback; }
}
function sessionSet(key,value){
  try{ sessionStorage.setItem(key,String(value)); }catch(e){}
}
function getPreviousRoundIds(){
  try{

  }catch(e){ return []; }
}
function getFreshVerbs(){

  if(pool.length<3) pool=VERBS.slice();

/* ---------- sentence building (from each verb's own example) ---------- */
var S3_POST={ask:' for help when she needs it.', read:' before she sleeps.', wash:' her hands when she gets home.', listen:' to music while she cleans.'};
var PAST_FIX=[["when I need it","when I needed it"],["when I get home","when I got home"],["while I clean","while I cleaned"],["until my bus comes","until my bus came"],["before I sleep","before I slept"],["you can do it","you could do it"],["it's ","it was "]];
var TIME_SWAPS=[[/\btoday\b/i,'yesterday'],[/\btonight\b/i,'last night'],[/\blater\b/i,'yesterday'],[/\bnow\b/i,'then']];
function parseEx(v){
  if(v.id==='be') return {pre:'I ',post:' tired today.',subj:'I'};
  var m=new RegExp('\\b('+v.base+'|'+v.third+')\\b','i').exec(v.exEn);
  var pre=v.exEn.slice(0,m.index), post=v.exEn.slice(m.index+m[0].length);
  return {pre:pre, post:post, subj:/^I\s*$/.test(pre)?'I':'3'};
}
function thirdSentence(v){
  var p=parseEx(v), pre=p.pre, post=p.post;
  if(p.subj==='I'){ pre='She '; post=S3_POST[v.id] || post.replace(/\bmyself\b/g,'herself').replace(/\bmy\b/g,'her').replace(/\bme\b/g,'her'); }
  return {pre:pre,post:post};
}
function pastSentence(v){
  var p=parseEx(v), post=p.post, pre=p.pre, swapped=false;
  /* Keep generated past examples natural: trim time/dependent clauses that
     would otherwise leave a present-tense verb behind. */
  post=post.replace(/\s+(when|before|while|until|after|so)\b[^.]*?(?=\.)/i,'');
  PAST_FIX.forEach(function(f){ post=post.split(f[0]).join(f[1]); });
  post=post.replace(/\bthis is\b/gi,'this was').replace(/\bit is\b/gi,'it was');
  TIME_SWAPS.forEach(function(t){ if(t[0].test(post)){ post=post.replace(t[0],t[1]); swapped=true; } });
  if(!swapped){ pre='Last week, '+(p.subj==='I'?pre:pre.charAt(0).toLowerCase()+pre.slice(1)); }
  return {pre:pre,post:post};
}
var PART_OVERRIDE={
  be:{pre:'I have ',post:' tired today.'},
  have:{pre:'I have ',post:' had this dog for years.'},
  know:{pre:'I have ',post:' known him for years.'},
  want:{pre:'I have ',post:' wanted to learn English for a long time.'},
  like:{pre:'I have always ',post:' liked coffee with milk.'},
  love:{pre:'I have always ',post:' loved this song.'},
  need:{pre:'I have ',post:' needed more sleep lately.'},
  mean:{pre:'I have ',post:' meant what I said.'},
  believe:{pre:'I have always ',post:' believed in you.'},
  understand:{pre:'I have ',post:' understood the problem since yesterday.'},
  seem:{pre:'It has ',post:' seemed cold all day.'},
  remember:{pre:'I have always ',post:' remembered your birthday.'},
  consider:{pre:'I have always ',post:' considered you a close friend.'},
  see:{pre:'I have already ',post:' seen my friend today.'},
  hear:{pre:'I have already ',post:' heard that song.'}
};
function partSentence(v){
  if(PART_OVERRIDE[v.id]) return PART_OVERRIDE[v.id];
  var t=thirdSentence(v);
  var post=t.post.replace(/\s+(when|before|while|until|after|so)\b[^.]*?(?=\.)/i,'');
  return {pre:t.pre+'has already ',post:post.replace(/\s+(later|tonight)(?=\.$)/i,'')};
}
function gerundExample(v){
  if(GER_OVERRIDE[v.id]) return GER_OVERRIDE[v.id];
  if(STATIVE.indexOf(v.id)>-1) return null;
  var p=parseEx(v);
  var post=p.post.replace(/\s+(when|before|while|until|every|sometimes|today|later|tonight|now|on (Sundays|Saturdays|Friday)|in the morning)\b.*?(?=\.$)/i,'').replace(/\s+(at|by) \d+\w*(?=\.$)/i,'');
  var subj=p.subj==='I' ? 'I am ' : p.pre.charAt(0).toLowerCase()+p.pre.slice(1)+'is ';
  return 'Right now, '+subj+v.ing+post;
}
function negativeExample(v){
  var p=pastSentence(v);
  if(v.id==='be') return "I wasn't tired yesterday.";
  return p.pre+"didn't "+v.base+p.post;
}

/* ---------- wrong-answer generators (other forms / common spelling mistakes) ---------- */
function uniq(correct,list,n){ var out=[]; list.forEach(function(x){ if(x && x!==correct && out.indexOf(x)===-1) out.push(x); }); return out.slice(0,n||3); }
function overgen(v){ return v.base.slice(-1)==='e'?v.base+'d':v.base+'ed'; }
function dThird(v){
  if(v.id==='be') return uniq(v.third,['am','are','be','was']);
  return uniq(v.third,[v.base,v.ing,v.past,v.part,v.base+'s',v.base+'es']);
}
function dPast(v){
  if(v.id==='be') return uniq(v.past,['were','be','been','being']);
  return uniq(v.past,[v.irr?overgen(v):null,v.base,v.part,v.ing,v.third,overgen(v)]);
}
function dPart(v){
  if(v.id==='be') return uniq(v.part,['was','were','be','being']);
  return uniq(v.part,[v.past,v.base,v.irr?overgen(v):null,v.ing,v.third,overgen(v)]);
}
// plausible -ing spelling mistakes only (dropped/kept e, doubled/undoubled consonant, y/ie)
function dIng(v){
  if(v.id==='be') return ['beeing','bing','be'];
  var b=v.base, last=b.slice(-1), prev=b.charAt(b.length-2), c=[b+'ing'];
  if(b.slice(-2)==='ie'){ c.push(b.slice(0,-1)+'ing'); }
  else if(last==='e'){ c.push(b.slice(0,-1)+'ing'); if('aeiou'.indexOf(prev)===-1) c.push(b.slice(0,-1)+prev+'ing'); }
  else if(last==='y'){ c.push(b.slice(0,-1)+'ing'); }
  else if(last==='o'){ c.push(b+'eing'); }
  else if('aeiouwxyh'.indexOf(last)===-1){ c.push(b+last+'ing'); }
  c.push(b); c.push(v.third); c.push(v.past); c.push(v.part);
  return uniq(v.ing,c);
}

/* ---------- quiz ---------- */
var quiz=[], qIdx=0, qScore=0, xpEarned=0, reviewMode=false, curOpts=[], quizTab='pres', justFinished=false;
function buildQ(v,tab,which){
  var q={verb:v,tab:tab,tries:0};
  if(which==='A'){
    var s=tab==='pres'?thirdSentence(v):tab==='past'?pastSentence(v):partSentence(v);
    q.kind='sentence';
    q.ans=tab==='pres'?v.third:tab==='past'?v.past:v.part;
    q.bad=tab==='pres'?dThird(v):tab==='past'?dPast(v):dPart(v);
    q.prompt=s.pre+'___ ('+v.base+')'+s.post;
    q.full=s.pre+q.ans+s.post;
    q.chip=tab==='pres'?'presente • she / he / it':tabInfo(tab).chip;
  }else{
    q.kind='typed';
    if(tab==='pres'){ q.ans=v.ing; q.prompt='Digite a forma -ing de “'+v.base+'”'; q.chip='digite • -ing'; q.full=v.base+' → '+v.ing; }
    else if(tab==='past'){ q.ans=v.past; q.prompt='Digite o passado simples de “'+v.base+'”'; q.chip='digite • passado simples'; q.full=v.base+' → '+v.past; }
    else { q.ans=v.part; q.prompt='Digite o particípio passado de “'+v.base+'”'; q.chip='digite • particípio passado'; q.full=v.base+' → '+v.part; }
  }
  return q;
}
function seedFor(s){return reviewMode?Math.floor(Math.random()*4294967296):simpleHash(s);}
function makeQuiz(tab){
  var qs=[];
  todays.forEach(function(v){ qs.push(buildQ(v,tab,'A')); qs.push(buildQ(v,tab,'B')); });
  qs=simpleShuffle(qs, seedFor(today+'-'+tab)).slice(0,QN);
  qs.forEach(function(q,i){ if(q.kind!=='typed') q.opts=simpleShuffle([q.ans].concat(q.bad), seedFor(q.ans+i+today+tab)); });
  return qs;
}
function optsHtml(list){
  curOpts=list;
  var html='<div class="q-opts" style="margin-top:14px">';
  for(var i=0;i<list.length;i++){ html+='<button class="q-opt" onclick="answer('+i+')"><span>'+esc(list[i])+'</span><span>→</span></button>'; }
  return html+'</div>';
}
function chipHtml(q){ return '<div class="xp-badge" style="background:#F5F2ED;border-color:var(--line);color:var(--muted)">'+esc(q.chip)+'</div>'; }
function openQuiz(){
  quizTab=activeTab; reviewMode=tabDone(quizTab);

  document.getElementById('quiz').classList.add('open'); showQ();
}
function closeQuiz(){document.getElementById('quiz').classList.remove('open');}
window.quitQuiz=function(){ if(qIdx>=quiz.length){ finishQuiz(); return; } if(confirm('Sair agora? Você perde o XP desta rodada.')) closeQuiz(); };
function showQ(){

  if(q.kind==='typed'){
    document.getElementById('quizBody').innerHTML=chipHtml(q)+'<div class="q-prompt"><span>'+esc(q.prompt)+'</span></div>'
      +'<div class="typed-wrap"><input id="typedAnswer" class="typed-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Sua resposta" placeholder="Digite sua resposta" inputmode="text"><button class="btn-primary" onclick="submitTyped()" style="margin-top:12px;height:52px">Verificar</button></div>';
    var input=document.getElementById('typedAnswer');

    setTimeout(function(){input.focus();},0);

function normalizeAnswer(s){ return String(s||'').trim().replace(/\s+/g,' ').toLowerCase(); }
window.submitTyped=function(){

window.answer=function(i){

function handleAnswer(q,correct,attempted){
  if(correct){
    if(q.tries===0) qScore++;
    if(!reviewMode) xpEarned += (q.tries===0?10:5);
    if(q.tries===0 && wrong[q.verb.id]){ wrong[q.verb.id]--; if(wrong[q.verb.id]<=0) delete wrong[q.verb.id]; }
  }else{
    q.tries++;
    wrong[q.verb.id]=(wrong[q.verb.id]||0)+1;
    if(q.tries<2){
      if(q.kind==='typed'){
        document.getElementById('quizBody').innerHTML=chipHtml(q)+'<div class="q-prompt"><span>'+esc(q.prompt)+'</span></div>'
          +'<div style="margin-top:12px;background:var(--yellow-bg);border:1px solid var(--yellow-line);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800">Quase — tenta de novo</div>'
          +'<div class="typed-wrap"><input id="typedAnswer" class="typed-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Sua resposta" placeholder="Digite sua resposta" inputmode="text"><button class="btn-primary" onclick="submitTyped()" style="margin-top:12px;height:52px">Verificar</button></div>';
        var retryInput=document.getElementById('typedAnswer');
        retryInput.addEventListener('keydown',function(e){ if(e.key==='Enter') submitTyped(); });
        setTimeout(function(){retryInput.focus();},0);
      }else{
        var remaining=curOpts.filter(function(o){return o!==attempted;});
        document.getElementById('quizBody').innerHTML=chipHtml(q)+'<div class="q-prompt"><span>'+esc(q.prompt)+'</span></div>'
          +'<div style="margin-top:12px;background:var(--yellow-bg);border:1px solid var(--yellow-line);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800">Quase — tenta outra</div>'+optsHtml(remaining);
      }
      save(); return;
    }
  }
  save();
  var v=q.verb, gain=q.tries===0?10:5;
  var extraPronNote=(q.kind==='typed' && /i$/i.test(String(attempted).trim()) && !/i$/i.test(String(q.ans).trim())) ? '<div style="margin-top:8px;background:var(--yellow-bg);border:1px solid var(--yellow-line);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800">🇧🇷 Lembrete: não acrescente um “i” no final. <b>'+esc(q.ans)+'</b> → '+esc(pronFor(q.ans))+'</div>' : '';
  var html='<div style="font-weight:900;font-size:22px">'+(correct?'✓ Boa!':'✕ Quase.')+'</div>';
  if(correct && !reviewMode) html+='<div class="xp-badge" style="margin-top:8px">+'+gain+' XP</div>'; else if(!correct) html+='<div style="margin-top:6px;color:var(--muted);font-size:13px;font-weight:700">A resposta era <b>'+esc(q.ans)+'</b>.</div>';
  html+='<div class="feedback" style="margin-top:12px"><div style="display:flex;align-items:center;gap:10px"><div style="font-weight:900;font-size:17px;flex:1">'+esc(q.full)+'</div>'+speakerBtn(q.kind==='sentence'?q.full:q.ans,'style="width:44px;height:44px;flex:none"')+'</div>'
    +'<div style="margin-top:8px;color:var(--muted);font-size:12px;font-weight:700">'+esc(v.base)+' → '+esc(v.third)+' / '+esc(v.ing)+' • '+esc(v.pastFull)+' • '+esc(v.part)+'</div>'
    +pronCue(q.ans)+extraPronNote+ruleHint(q)+'</div>'
    +'<button class="btn-primary" onclick="nextQ()" style="margin-top:16px;height:52px">Continuar</button>';
  document.getElementById('quizBody').innerHTML=html;
};
window.nextQ=function(){
  qIdx++;
  if(qIdx<quiz.length){ showQ(); return; }
  document.getElementById('qbar').style.width='100%';

    xp+=xpEarned;
    if(lastDate!==today){ streak=(lastDate===yesterday)?streak+1:1; lastDate=today; }

function launchConfetti(){

  var ctx=c.getContext('2d'); if(!ctx) return; c.width=c.offsetWidth; c.height=c.offsetHeight;
  var pieces=[]; for(var i=0;i<60;i++){ pieces.push({x:Math.random()*c.width,y:Math.random()*-20,r:Math.random()*6+2,color:'hsl('+(Math.random()*40+20)+',90%,60%)',vx:(Math.random()-0.5)*4,vy:Math.random()*3+2}); }
  var anim; function draw(){ ctx.clearRect(0,0,c.width,c.height); for(var k=0;k<pieces.length;k++){ var p=pieces[k]; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=p.color; ctx.fill(); p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; if(p.y>c.height) p.y=-10; } anim=requestAnimationFrame(draw); }
  draw(); setTimeout(function(){ cancelAnimationFrame(anim); }, 2500);
}
document.addEventListener('keydown',function(e){
  var quizOpen=document.getElementById('quiz').classList.contains('open');
  if(e.key==='Escape'){ if(quizOpen) quitQuiz(); else if(document.getElementById('explore').classList.contains('open')) closeExplore(); return; }
  if(!quizOpen) return;
  var n=parseInt(e.key,10), opts=document.querySelectorAll('#quizBody .q-opt');
  if(n>=1 && n<=opts.length){ opts[n-1].click(); }
  else if(e.key==='Enter' && document.activeElement.tagName!=='BUTTON'){ var c=document.querySelector('#quizBody .btn-primary'); if(c) c.click(); }
});
document.getElementById('practiceBtn').addEventListener('click', openQuiz);
render();
</script>
