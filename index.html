function dayStr(off){var d=new Date();d.setDate(d.getDate()+(off||0));return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function simpleHash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))%1000000007;}return h;}
function simpleShuffle(arr,seed){var a=arr.slice();var t=(seed>>>0)+0x6D2B79F5;function r(){t+=0x6D2B79F5;var x=t;x=Math.imul(x^(x>>>15),x|1);x^=x+Math.imul(x^(x>>>7),x|61);return((x^(x>>>14))>>>0)/4294967296;}for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

function speak(text, btn, rate){
  try{
    if(!('speechSynthesis' in window)) return;
    if(window.speechSynthesis.paused) window.speechSynthesis.resume();
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=rate||0.9; u.volume=1;
    if(speechVoice) u.voice=speechVoice;
    if(btn){
      btn.classList.add('playing');
      u.onend=function(){btn.classList.remove('playing');};
      u.onerror=function(){btn.classList.remove('playing');};
    }
    window.speechSynthesis.speak(u);
  }catch(e){ if(btn) btn.classList.remove('playing'); }
}

function parseEx(v){
  var m=new RegExp('\\b('+v.base+'|'+v.third+')\\b','i').exec(v.exEn);
  if(!m) return {pre:'I ',verb:v.base,post:'',subj:'I'};
  var pre=v.exEn.slice(0,m.index), post=v.exEn.slice(m.index+m[0].length);
  var subj=/^I\b/i.test(v.exEn.trim())?'I':'other';
  return {pre:pre,verb:m[0],post:post,subj:subj};
}
function thirdSentence(v){
  var p=parseEx(v), pre=p.pre, post=p.post;
  if(v.id==='be') return {pre:'She ',post:v.exEn.replace(/^I'm/i,'').replace(/\bmy\b/g,'her')};
  post=post.replace(/\s+(when|before|while|until|after|so)\b[^.]*?(?=\.)/i,'');
  if(p.subj==='I'){
    pre=pre.replace(/^I\b/,'She');
    pre=pre.replace(/\bmy\b/gi,'her').replace(/\bmine\b/gi,'hers').replace(/\bme\b/gi,'her').replace(/\bour\b/gi,'their');
    post=post.replace(/\bmy\b/gi,'her').replace(/\bmine\b/gi,'hers').replace(/\bme\b/gi,'her').replace(/\bour\b/gi,'their');
  }
  return {pre:pre,post:post};
}
function pastSentence(v){
  var p=parseEx(v), pre=p.pre, post=p.post;
  if(v.id==='be') return {pre:'I ',post:' tired yesterday.'};
  post=post.replace(/\s+(when|before|while|until|after|so)\b[^.]*?(?=\.)/i,'');
  post=post.replace(/\btoday\b/gi,'yesterday').replace(/\btonight\b/gi,'last night').replace(/\bnow\b/gi,'then');
  post=post.replace(/\bthis is\b/gi,'this was').replace(/\bwhat I say\b/gi,'what I said');
  if(!/\b(yesterday|last|ago|this morning|earlier)\b/i.test(post)) pre='Last week, '+(p.subj==='I'?pre:pre.charAt(0).toLowerCase()+pre.slice(1));
  return {pre:pre,post:post};
}

function summaryText(tab){
  if(tab==='keep') return 'Prática de manutenção • '+quiz.length+' perguntas de vocabulário, gramática e uso real.';
  return (quizVerbs||todays).map(function(v){
    return tab==='pres' ? v.base+' → '+v.third+' / '+v.ing : tab==='past' ? v.base+' → '+v.pastFull : tab==='part' ? v.base+' → '+v.pastFull+' → '+v.part : v.base+' → '+v.pt;
  }).join('  •  ');
}
window.finishQuiz=function(){ closeQuiz(); justFinished=true; showDone(); renderHeader(); renderTabs(); updateProgress(); };
function showDone(){
  document.getElementById('doneScore').textContent=qScore+' / '+quiz.length;
  document.getElementById('doneXP').textContent=tabInfo(quizTab).name+' • '+(reviewMode?'revisão • sem XP':'+'+xpEarned+' XP')+' • Total: '+xp+' XP';
  document.getElementById('doneStreak').textContent=streak;
  document.getElementById('doneLevel').textContent='Lv '+(Math.floor(xp/100)+1);
  document.getElementById('doneText').textContent=summaryText(quizTab);
  document.getElementById('doneScreen').classList.add('show');

}
window.closeDone=function(){
  document.getElementById('doneScreen').classList.remove('show');
  if(justFinished){
    justFinished=false; if(quizVerbs) return;
    var order=visibleTabs().map(function(t){return t.id;}), i=order.indexOf(quizTab);
    for(var k=1;k<=order.length;k++){ var nxt=order[(i+k)%order.length]; if(!tabDone(nxt)){ switchTab(nxt); window.scrollTo(0,0); break; } }
  }
};

var currentCat='Todos';
function openExplore(){ document.getElementById('explore').classList.add('open'); renderExplore(); }
function closeExplore(){ document.getElementById('explore').classList.remove('open'); }
function renderExplore(){
  var cats=['Todos','Irregulares','Rotina','Casa','Trabalho','Pessoas','Movimento'];
  var html=''; for(var i=0;i<cats.length;i++){ html+='<button class="chip '+(currentCat===cats[i]?'active':'')+'" onclick="setCat(\''+cats[i]+'\')">'+cats[i]+'</button>'; }
  document.getElementById('chips').innerHTML=html;
  filterExplore();
}
function setCat(c){ currentCat=c; renderExplore(); }
function filterExplore(){
  var q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  var list=VERBS.filter(function(v){
    if(currentCat==='Irregulares'){ if(!v.irr) return false; }
    else if(currentCat!=='Todos' && v.cat!==currentCat) return false;
    if(!q) return true;
    return v.base.toLowerCase().includes(q) || v.pt.toLowerCase().includes(q) || v.exEn.toLowerCase().includes(q) || v.past.toLowerCase().includes(q) || v.part.toLowerCase().includes(q);
  });
  var html='';
  list.forEach(function(v){
    html+='<button type="button" class="explore-item" onclick="openVerbFromExplore(\''+v.id+'\')"><div><b>'+esc(v.base)+'</b> <small>— '+esc(v.pt)+'</small><div style="font-size:0.75rem;color:#6B7280;font-weight:600;margin-top:2px">'+esc(v.base)+' • '+esc(v.pastFull)+' • '+esc(v.part)+'</div></div><div style="font-size:0.75rem">→</div></button>';
  });
  document.getElementById('exploreList').innerHTML=html || '<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.8125rem">Nenhum verbo encontrado</div>';
}
function openVerbFromExplore(id){
  var v=VERBS.find(function(x){return x.id===id;});
  if(!v) return;
  closeExplore();
  var old=document.getElementById('exploreCard'); if(old) old.remove();
  var cardHtml='<div class="card" id="exploreCard" style="border-color:var(--ink);box-shadow:var(--shadow)">'
    +'<div class="card-top"><div>'+badgeHtml(v,'past')+'</div><button class="icon-btn" style="width:44px;height:44px" onclick="document.getElementById(\'exploreCard\').remove()" aria-label="fechar">✕</button></div>'
    +'<div class="big-wrap"><div><div class="big" lang="en">'+esc(v.base)+'</div>'+pronCue(v.base)+'</div>'+speakerBtn(v.exEn)+'</div><div class="pt">'+esc(v.pt)+'</div>'
    +'<div class="ex"><div class="en" lang="en">'+esc(v.exEn)+'</div><div class="pt-br">'+esc(v.exPt)+'</div></div>'
    +'<div style="margin-top:12px">'+formsAll(v)+'</div></div>';
  document.getElementById('cards').insertAdjacentHTML('afterbegin', cardHtml);
  window.scrollTo({top:0,behavior:'smooth'});
}

function launchConfetti(){
  var c=document.getElementById('confetti'); if(!c) return; if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx=c.getContext('2d'); if(!ctx) return; c.width=c.offsetWidth; c.height=c.offsetHeight;
  var pieces=[]; for(var i=0;i<60;i++){ pieces.push({x:Math.random()*c.width,y:Math.random()*-20,r:Math.random()*6+2,color:'hsl('+(Math.random()*40+20)+',90%,60%)',vx:(Math.random()-0.5)*4,vy:Math.random()*3+2}); }
  var anim; function draw(){ ctx.clearRect(0,0,c.width,c.height); for(var k=0;k<pieces.length;k++){ var p=pieces[k]; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=p.color; ctx.fill(); p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; if(p.y>c.height) p.y=-10; } anim=requestAnimationFrame(draw); }
  draw(); setTimeout(function(){ cancelAnimationFrame(anim); }, 2500);
}
document.addEventListener('keydown',function(e){
  var quizOpen=document.getElementById('quiz').classList.contains('open');
  if(e.key==='Escape'){ var ov=['selftest','chart','settings'].filter(function(id){return document.getElementById(id).classList.contains('show');})[0]; if(ov){ closeOv(ov); return; } if(quizOpen) quitQuiz(); else if(document.getElementById('explore').classList.contains('open')) closeExplore(); return; }
  if(!quizOpen) return;
  var n=parseInt(e.key,10), opts=document.querySelectorAll('#quizBody .q-opt');
  if(n>=1 && n<=opts.length){ opts[n-1].click(); }
  else if(e.key==='Enter' && document.activeElement.tagName!=='BUTTON'){ var c=document.querySelector('#quizBody .btn-primary'); if(c) c.click(); }
});
var APP_VERSION='v33';
var TS_STEPS=[1,1.15,1.3,1.5], tsIdx=0;
try{tsIdx=parseInt(sessionStorage.getItem('verb-lab-v33-ts')||'0',10)||0;}catch(e){}
if(tsIdx<0||tsIdx>3) tsIdx=0;
function applyTS(){ document.documentElement.style.fontSize=(16*TS_STEPS[tsIdx])+'px'; }
applyTS();
window.setTS=function(d){ tsIdx=Math.max(0,Math.min(3,tsIdx+d)); try{sessionStorage.setItem('verb-lab-v33-ts',String(tsIdx));}catch(e){} applyTS(); var e=document.getElementById('tsVal'); if(e) e.textContent=Math.round(TS_STEPS[tsIdx]*100)+'%'; };
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},2600); }
function copyText(txt,ok){
  function fb(){ var a=document.createElement('textarea'); a.value=txt; a.setAttribute('readonly',''); a.style.cssText='position:fixed;opacity:0'; document.body.appendChild(a); a.select(); try{document.execCommand('copy'); toast(ok);}catch(e){toast('Não consegui copiar');} a.remove(); }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){toast(ok);},fb); } else fb();
}
function showOv(id,h){ var e=document.getElementById(id); e.innerHTML=h; e.classList.add('show'); }
window.closeOv=function(id){ document.getElementById(id).classList.remove('show'); };
function sec(t,b){ return '<div class="set-sec"><h3>'+t+'</h3>'+b+'</div>'; }

var ALT={travel:{past:['travelled'],part:['travelled']},learn:{past:['learnt'],part:['learnt']},get:{part:['got']}};
function acceptList(q){ var a=[q.ans], x=q.verb&&ALT[q.verb.id]; if(x){ var k=q.tab==='past'?'past':q.tab==='part'?'part':null; if(k&&x[k]) a=a.concat(x[k]); } return a; }
function formsLine(q,v){ if(q.cat==='micro') return q.pt?'<span>'+esc(q.pt)+'</span>':''; return q.cat?'':esc(v.base)+' → '+esc(v.third)+' / '+esc(v.ing)+' • '+esc(v.pastFull)+' • '+esc(v.part); }
window.reportQ=function(){ var q=quiz[qIdx]; if(!q) return; copyText('VL33|'+(q.cat||q.verb.id)+'|'+q.tab+'|'+q.kind+'|'+q.prompt+'|resp:'+q.ans,'Código copiado — cole no WhatsApp para o professor'); };

function missedIds(){ return Object.keys(wrong).filter(function(k){return wrong[k]>0&&VERBS.some(function(v){return v.id===k;});}).sort(function(a,b){return wrong[b]-wrong[a];}); }
function updateMissedBtn(){ var n=missedIds().length, b=document.getElementById('missedBtn'); if(b){ b.style.display=n?'inline-block':'none'; b.textContent='Revisar erros ('+n+')'; } }
window.openMissed=function(){
  var vs=missedIds().slice(0,3).map(function(id){return VERBS.find(function(v){return v.id===id;});});
  if(!vs.length){ toast('Nenhum erro para revisar'); return; }
  quizTab=activeTab; reviewMode=true; quizVerbs=vs;
  quiz=makeQuiz(quizTab,vs); qIdx=0; qScore=0; xpEarned=0;
  document.getElementById('quiz').classList.add('open'); showQ();
};

window.openChart=function(){
  var irr=VERBS.filter(function(v){return v.irr;}).sort(function(a,b){return a.base<b.base?-1:1;});
  var rows=irr.map(function(v){ function c(w){return '<td><b>'+esc(w)+'</b><small>'+esc(pronFor(w)||'')+'</small></td>';} return '<tr>'+c(v.base)+c(v.pastFull)+c(v.part)+'<td>'+esc(v.pt)+'</td></tr>'; }).join('');
  showOv('chart','<div class="done-card chart-card"><div class="set-h"><b>Verbos irregulares</b><span class="noprint"><button class="link-btn" onclick="window.print()">🖨 Imprimir</button> <button class="link-btn" onclick="closeOv(\'chart\')">Fechar</button></span></div><table class="chart-t"><thead><tr><th>Base</th><th>Passado</th><th>Particípio</th><th>PT</th></tr></thead><tbody>'+rows+'</tbody></table></div>');
};

var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferredPrompt=e; });
window.doInstall=function(){ if(!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt=null; closeOv('settings'); };
window.copyClassLink=function(){
  var t=['pres','past','part','prep'].filter(function(id){var el=document.getElementById('cl_'+id); return el && el.checked;});

window.resetAll=function(){
  if(!confirm('Apagar XP, sequência e escolhas deste aparelho?')) return;
  try{ sessionStorage.clear(); }catch(e){}
  location.reload();
};
window.openSettings=function(){
  var cl=['pres','past','part','prep'].map(function(id){return '<label class="cl"><input type="checkbox" id="cl_'+id+'"'+' checked'+'> '+tabInfo(id).name+'</label>';}).join('');
  showOv('settings','<div class="done-card set-card"><div class="set-h"><b>Opções</b><button class="icon-btn" onclick="closeOv(\'settings\')" aria-label="fechar">✕</button></div>'
   +sec('Tamanho do texto','<div class="row"><button class="icon-btn" onclick="setTS(-1)" aria-label="texto menor">A−</button><b id="tsVal">'+Math.round(TS_STEPS[tsIdx]*100)+'%</b><button class="icon-btn" onclick="setTS(1)" aria-label="texto maior">A+</button></div>')
   +sec('Instalar o app','<p>Android (Chrome): menu ⋮ → <b>Instalar app</b>.<br>iPhone (Safari): <b>Compartilhar</b> → <b>Adicionar à Tela de Início</b>.<br>Computador (Chrome ou Edge): ícone de instalar na barra de endereço.</p>'+(deferredPrompt?'<button class="btn-primary" style="margin-top:10px" onclick="doInstall()">Instalar agora</button>':''))
   +sec('Verbos irregulares','<button class="btn-primary" onclick="openChart()">Ver / imprimir tabela</button>')
   +sec('Link para turma (professor)','<div class="cl-row">'+cl+'</div><button class="btn-primary" style="margin-top:10px" onclick="copyClassLink()">Copiar link</button>')
   +sec('Privacidade','<p>Nenhum dado sai do seu aparelho. XP e escolhas ficam só neste navegador.</p>')
   +sec('Avançado','<button class="link-btn" onclick="runSelfTest()">Autoteste do conteúdo</button> <button class="link-btn" onclick="resetAll()">Apagar meu progresso</button><p style="margin-top:8px">Versão '+APP_VERSION+'</p>')
   +'</div>');
};

window.runSelfTest=function(){
  var R={blank:[],leak:[],dup:[],opts:[],agree:[],pron:[],err:[],gloss:[]}, gl={};
  VERBS.forEach(function(v){
    (gl[v.pt]=gl[v.pt]||[]).push(v.base);
    ['pres','past','part'].forEach(function(t){
      try{
        var q=buildQ(v,t,'A'), p=q.prompt, nh=p.replace(/\([^)]*\)/,'');
        if((p.match(/___/g)||[]).length!==1) R.blank.push(t+'/'+v.base);
        if(new RegExp('\\b'+q.ans+'\\b','i').test(nh)) R.leak.push(t+'/'+v.base+': '+p);
        if(/\b(\w+)\s+\1\b/i.test(q.full)) R.dup.push(t+'/'+v.base+': '+q.full);
        if(q.bad.length<3||q.bad.indexOf(q.ans)>-1||new Set(q.bad).size!==q.bad.length) R.opts.push(t+'/'+v.base);
        if(t==='pres'){ var pre=thirdSentence(v).pre.trim(); if(/^(we|you|they|i)\b/i.test(pre)||/\b(friends|parents|classes|things|people|kids|students)\b/i.test(pre)) R.agree.push(v.base+': '+p); }
      }catch(e){ R.err.push(v.base+' ('+t+'): '+e.message); }
    });
    [v.base,v.third,v.ing,v.past,v.part].forEach(function(f){ if(!pronFor(f)) R.pron.push(f); });
  });
  Object.keys(gl).forEach(function(k){ if(gl[k].length>1) R.gloss.push(k+': '+gl[k].join(' / ')); });
  var names={blank:'Cada pergunta tem exatamente um espaço',leak:'A resposta não aparece na pergunta',dup:'Sem palavras repetidas',opts:'Opções válidas (3 erradas, diferentes)',agree:'Sujeito concorda com o verbo (she/he/it)',pron:'Pronúncia para todas as formas',err:'Sem erros ao gerar frases',gloss:'Traduções (glosses) sem repetição'};
  var fails=0, h='<div class="done-card set-card"><div class="set-h"><b>Autoteste</b><button class="icon-btn" onclick="closeOv(\'selftest\')" aria-label="fechar">✕</button></div>';
  Object.keys(names).forEach(function(k){
    var bad=R[k], ok=!bad.length; if(!ok) fails++;
    h+='<div class="st-row '+(ok?'ok':'bad')+'"><b>'+(ok?'✓':'✗')+' '+names[k]+'</b>'+(ok?'':' ('+bad.length+')<div class="st-list">'+bad.slice(0,12).map(esc).join('<br>')+(bad.length>12?'<br>…':'')+'</div>')+'</div>';
  });
  h+='<p style="margin-top:12px;font-weight:800">'+(fails?fails+' verificação(ões) com problema.':'Tudo certo ✓')+' • '+VERBS.length+' verbos</p></div>';
  showOv('selftest',h);
  return {fails:fails,R:R};
};
